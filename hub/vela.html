<!doctype html>
<html><head><meta charset="utf-8"><title>TradeX - Vela engine</title>
<style>
  html,body{margin:0;height:100%;background:#0f161d;color:#d6dee5;font:13px system-ui,Segoe UI,sans-serif}
  #top{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #26333f;height:31px;box-sizing:border-box}
  #top button,#top select{background:#16212b;color:#d6dee5;border:1px solid #2b3946;padding:3px 8px;cursor:pointer}
  #chart{position:absolute;top:31px;left:0;right:0;bottom:0}
  /* Vela 0.9.3 bug (found 2026-11-12, also on the pre-change page): once the mouse moves over an open toolbar menu, the
     chart canvas paints above the menu layer and takes the click, so no menu entry (chart style, etc.) can be picked.
     Keep the menu layer above the chart; the layer itself lets clicks through where it has no menu. */
  .vela-ui-layer { z-index: 30; pointer-events: none; }
  .vela-ui-layer > * { pointer-events: auto; }
  #ovgroup{display:none;gap:6px;align-items:center;margin-left:6px}
  #ovgroup.show{display:inline-flex}
  #ovinfo{color:#8fa3b4;font-size:12px}
  #ovinfo.warn{color:#d9a441}
</style></head><body>
<div id="top"><b>TradeX</b> <span style="color:#93a2af">Vela engine</span>
  <select id="layout"><option value="">1 chart</option><option value="2h">2 side by side</option><option value="2v">2 stacked</option><option value="4">4 charts</option><option value="8">8 charts</option></select>
  <span style="color:#93a2af">Tips: type a letter for symbol search, a digit for timeframe, ? for all shortcuts. Drag pane borders to resize.</span>
  <button id="auto">Code trendline</button>
  <span id="ovgroup">
    <select id="ovmode" title="Overlay real orders or a backtest's trades on the candles">
      <option value="off">No overlay</option>
      <option value="orders">Orders (real)</option>
      <option value="backtest">Backtest trades</option>
    </select>
    <select id="ovtable" title="Which backtest table to read"></select>
    <select id="ovstrategy" title="Strategy label within that table"></select>
    <span id="ovinfo"></span>
  </span></div>
<div id="chart"></div>
<script src="vela.bundle.js"></script>
<script src="theme.js"></script>
<script src="lab.js"></script>
<script src="orderflow_delta.js"></script>
<script src="orderflow_profile.js"></script>
<script src="orderflow_charttypes.js"></script>
<script src="orderflow_footprint_draw.js"></script>
<script src="orderflow_svp_type.js"></script>
<script src="orderflow_tpo_type.js"></script>
<script src="drawing_favbar.js"></script>
<script src="orderflow_autofit.js"></script>
<script>
let lastBars = [];
const provider = {
  async listSymbols() {
    return LabSymbols.map((s) => ({ ticker: s.ticker, description: s.name, type: /crypto|bybit-(perp|spot|futures|inverse|mark|index)/.test(s.group) ? "crypto" : /forex/.test(s.group) ? "forex" : s.group === "arm-stock" ? "stock" : /index|indices/.test(s.group) ? "index" : "commodity" }));
  },
  async getBars(ticker, timeframe, range = {}) {
    const tf = LabTF.fromAny(timeframe);
    const want = range.limit || 1000;
    // Feeds cap one reply (remote MT5 5000, Bybit/Binance 1000). Vela treats a short reply as "no older history exists",
    // so page backwards here until we have what Vela asked for, or the feed runs out (2026-11-13).
    let out = [], to = range.to;
    for (let page = 0; page < 40 && out.length < want; page++) {
      const got = (await LabFeed.history(ticker, tf, to, want - out.length)).map((b) => ({ ...b, time: b.time * 1000 }));
      const older = out.length ? got.filter((b) => b.time < out[0].time) : got;
      if (!older.length) break;
      out = older.concat(out);
      if (range.from && out[0].time <= range.from) break;
      to = out[0].time - 1;
    }
    if (range.from) out = out.filter((b) => b.time >= range.from);
    if (!range.to) { lastBars = out; setTimeout(applyTheme, 400); setTimeout(() => { try { ovSync(); ovPaint(); } catch (e) {} }, 600); }  // the volume indicator mounts with the data: colour it then
    return out;
  },
  subscribe(ticker, timeframe, onBar) {
    const tf = LabTF.fromAny(timeframe), step = LabTF.sec[tf] * 1000;
    let chain = Promise.resolve();
    const push = (bar) => {
      const last = lastBars[lastBars.length - 1];
      if (last && bar.time < last.time) return;
      if (last && last.time === bar.time) lastBars[lastBars.length - 1] = bar; else lastBars.push(bar);
      onBar(bar);
    };
    return LabFeed.live(ticker, tf, (b) => {
      const bar = { ...b, time: b.time * 1000 };
      chain = chain.then(async () => {
        // A live candle far after our last one means candles are missing (laptop slept, feed reconnected, or the
        // first load came from a stale cache). Vela does not fill such a hole by itself: fetch the missing candles
        // first, so the chart and every indicator stay continuous (2026-11-13).
        const last = lastBars[lastBars.length - 1];
        if (last && bar.time - last.time > 2 * step) {
          try {
            const n = Math.min(5000, Math.ceil((bar.time - last.time) / step) + 5);
            const fill = await LabFeed.history(ticker, tf, undefined, n);
            for (const f of fill) { const t = f.time * 1000; if (t > last.time && t < bar.time) push({ ...f, time: t }); }
          } catch (e) { console.warn("gap fill failed", e); }
        }
        push(bar);
      });
    });
  },
};

let ws;
// A Pine barcolor() repaints candle bodies over the user's colours. The hub's setting wins unless "Let indicators recolour candles" is on.
class HubPineEngine extends VelaLab.PineWorkerEngine {
  execute(req, handlers) {
    const h = Object.create(handlers);
    h.onModel = (model) => { if (!HubSettingsLoad().indicatorBars && model && model.barColors) model = { ...model, barColors: undefined }; handlers.onModel(model); };
    return super.execute(req, h);
  }
}
// Inside the TradeX, Vela's own "Indicators" button opens the hub's own Indicators dialog
// (Vela native indicators + your own Pine scripts in one place).
if (LabEmbedded && VelaLab.registerWidgetAction) {
  VelaLab.registerWidgetAction({ id: "indicators", target: "topbar", align: "left", label: "Indicators", icon: "indicators",
    run: () => window.parent.postMessage({ evt: "indicators:open" }, location.origin) });
}
// ---- Theme (TradeX settings) ----
// hexA() comes from theme.js
function velaTheme() { const t = HubTheme; return { background: t.bg, textColor: t.text, gridColor: t.grid, borderColor: t.line, upColor: t.up, downColor: t.down, fontFamily: t.font }; }
// Candle colours have one home: the hub's Settings panel. Inside the hub, Vela's own dialog hides its colour rows.
const CANDLE_COLOUR_ROWS = ["symbol.style.candles.body", "symbol.style.candles.borders", "symbol.style.candles.wick", "symbol.style.bars.up-color", "symbol.style.bars.down-color"];
function guardCandleColours(chart) {
  if (!LabEmbedded || chart.hubGuarded) return;
  chart.hubGuarded = true;
  try { chart.renderer.setSettingsVisibility({ hidden: CANDLE_COLOUR_ROWS }); } catch (e) { console.warn("settings rows", e); }
  // Vela's "Reset defaults" must not pull the candles away from the hub's colours.
  try { chart.renderer.onConfigChanged(() => { const c = chart.renderer.getConfig().candles; if (c && (c.upColor !== HubTheme.up || c.downColor !== HubTheme.down)) colorChart(chart); }); } catch (e) { console.warn("config guard", e); }
}
function colorChart(chart) {
  const t = HubTheme;
  guardCandleColours(chart);
  try {
    chart.renderer.applyConfig({
      layout: { background: t.bg, textColor: t.text, fontFamily: t.font },
      grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } },
      crosshair: { color: t.dim, labelBackground: t.raised },
      priceScale: { borderColor: t.line }, panes: { separatorColor: t.line },
      candles: { upColor: t.up, downColor: t.down, borderUpColor: t.up, borderDownColor: t.down, wickUpColor: t.up, wickDownColor: t.down },
      bars: { upColor: t.up, downColor: t.down },
      line: { color: t.accent }, area: { lineColor: t.accent, topColor: hexA(t.accent, 0.28), bottomColor: hexA(t.accent, 0.02) },
      baseline: { topLineColor: t.up, bottomLineColor: t.down, topFillColor: hexA(t.up, 0.25), bottomFillColor: hexA(t.down, 0.25) },
      trades: { longColor: t.up, shortColor: t.down },
    });
  } catch (e) { console.warn("theme config", e); }
  try { // built-in volume keeps its own colours: recolour it only if it is on the chart
    if (chart.presentNativeIndicators().includes("volume")) chart.addNativeIndicator("volume").setInputs({ upColor: t.up + "6b", downColor: t.down + "6b" });
  } catch (e) { console.warn("volume colours", e); }
}
function applyTheme() {
  try { ws.setTheme(velaTheme()); } catch (e) { console.warn("setTheme", e); }
  (ws.cells ? ws.cells() : [ws.active]).forEach((c) => c && c.chart && colorChart(c.chart));
}
const VELA_TF = { M1: "1", M5: "5", M15: "15", M30: "30", H1: "60", H4: "240", D1: "1D" };
function build(layout) {
  const host = document.getElementById("chart");
  if (ws && ws.destroy) ws.destroy();
  host.innerHTML = "";
  ws = new VelaLab.VelaWorkspace(host, {
    // "1" (not false) so the layout can change in place later; top-level symbol/timeframe are every cell's default.
    layout: layout || "1", symbol: "lab:" + LabDefaultSymbol, timeframe: VELA_TF[LabDefaultTF], live: true,
    // History depth. Vela's default is 500 candles and it does NOT load more when you scroll left, so 1m-15m charts
    // only reached back a few days. More: chart settings > Advanced > Bars to fetch, or the 3M/6M/1Y buttons (2026-11-13).
    bars: 10000,
    theme: velaTheme(), upColor: HubTheme.up, downColor: HubTheme.down,
    providers: { lab: () => provider }, persist: false,
    // Inside the TradeX wrapper, symbol / timeframe / layout live in the wrapper's bar only (no duplicate controls).
    ...(LabEmbedded ? { topbar: { left: ["style", "indicators", "undo-redo"] } } : {}),
    // Pine Script runs in its own worker per chart (PineTS via @luxalgo/vela-pinets), so heavy scripts never freeze the chart.
    engines: { pine: () => new HubPineEngine() },
  });
  // Floating favourites bar for starred drawing tools (drawing_favbar.js).
  try { TradeXFavBar.mount(ws, host); } catch (e) { console.warn("favourites bar", e); }
  try { TradeXAutoFit.mount(ws); } catch (e) { console.warn("order-flow auto fit", e); }
  try { ovInit(); } catch (e) { console.warn("CAIT overlay ui", e); }
  // Colour every chart once its first history is in (the volume indicator mounts with the data).
  setTimeout(applyTheme, 1500);
  // Tell the TradeX shell when the symbol or timeframe is changed inside Vela.
  ws.chart.on("market:changed", ({ symbol, timeframe }) => {
    // Remember the current market, so a layout rebuild opens on it (not on the first symbol).
    if (symbol) window.LabDefaultSymbol = String(symbol).replace(/^lab:/, "");
    if (timeframe) window.LabDefaultTF = LabTF.fromAny(timeframe);
  });
  // An indicator removed from Vela's legend: the hub forgets it too (else it comes back on reload).
  // Settings changed in Vela's dialog: the hub stores the values so they survive a reload.
  try { ws.chart.on("indicator:inputs", (ev) => { const h = ws.chart.indicators().find((x) => x.id === (ev && ev.id)); if (LabEmbedded && h) window.parent.postMessage({ evt: "ind:inputs", id: h.id, inputs: h.inputValues(), props: h.propValues ? h.propValues() : {} }, location.origin); }); } catch (_) {}
  // Last run per script (plot values): proof that an indicator really produced numbers (click test, status).
  window.lastRuns = {};
  try { ws.chart.on("script:run", (ev) => { if (ev && ev.id) window.lastRuns[ev.id] = { plots: ev.plots || {}, bar: ev.bar, warnings: (ev.warnings || []).length, at: Date.now() }; }); } catch (_) {}
  try { ws.chart.on("indicator:removed", (ev) => { if (LabEmbedded && ev && ev.id) window.parent.postMessage({ evt: "ind:removed", id: ev.id }, location.origin); }); } catch (_) {}
  ws.chart.on("market:changed", ({ symbol, timeframe }) => LabNotify(String(symbol || "").replace(/^lab:/, ""), LabTF.fromAny(timeframe || "1")));
}
build("");
document.getElementById("layout").onchange = (e) => build(e.target.value);

function addCodeTrendline() {
  const b = lastBars, n = b.length; if (n < 30) return null;
  const from = Math.max(2, n - 120), lows = [];
  for (let i = from; i < n - 2; i++) if (b[i].low < b[i-1].low && b[i].low < b[i-2].low && b[i].low < b[i+1].low && b[i].low < b[i+2].low) lows.push(b[i]);
  if (lows.length < 2) return null;
  const a = lows.reduce((m, x) => (x.low < m.low ? x : m), lows[0]);
  const later = lows.filter((x) => x.time > a.time);
  const c = later.length ? later.reduce((m, x) => (x.low < m.low ? x : m), later[0]) : lows[lows.length - 1];
  return ws.chart.drawings.add("trendline", { paneId: "price", anchors: [{ time: a.time, price: a.low }, { time: c.time, price: c.low }] });
}
document.getElementById("auto").onclick = addCodeTrendline;

// ---- CAIT overlays ---------------------------------------------------------
// Vela has no marker series, so each marker is a single-anchor drawing. That
// means we must track and remove them ourselves: they are real drawings on the
// chart, not a layer that can be swapped wholesale.
//
// Orders and backtest trades stay visually distinct. An order is what a venue
// did; a backtest marker is what a model says would have happened.
let ovMode = "off", ovTable = "donchian", ovStrategy = "", ovHandles = [], ovInfoLast = null, ovBusy = false;
// Tool names vary across Vela builds; the first that works is kept.
const OV_UP_TOOLS = ["arrowmarkup", "arrow-up", "arrowup", "flagmark", "label"];
const OV_DOWN_TOOLS = ["arrowmarkdown", "arrow-down", "arrowdown", "flagmark", "label"];
let ovUpTool = null, ovDownTool = null;

function ovAvailable() { return /^CAIT_/.test(String(window.LabDefaultSymbol || "")); }

function ovAdd(tools, cached, anchor, color, text) {
  const names = cached ? [cached] : tools;
  for (const t of names) {
    try {
      const h = ws.chart.drawings.add(t, {
        paneId: "price", anchors: [anchor],
        properties: { color, backgroundColor: color, textColor: color, text },
      });
      if (h) return { handle: h, tool: t };
    } catch (e) { /* try the next name */ }
  }
  return null;
}

function ovClear() {
  for (const h of ovHandles) { try { h.remove ? h.remove() : ws.chart.drawings.remove(h); } catch (e) {} }
  ovHandles = [];
}

// Why the last paint drew nothing. Vela gives no feedback when a drawing is
// rejected, so without this a silent empty overlay is indistinguishable from
// "there was nothing in the window" — which cost an hour the first time.
let ovWhy = null;
async function ovPaint() {
  if (!ws || !ws.chart) { ovWhy = "no ws.chart"; return; }
  ovClear();
  ovShowInfo(0);
  if (ovMode === "off") { ovWhy = "mode off"; return; }
  if (!ovAvailable()) { ovWhy = "not a CAIT ticker"; return; }
  if (!lastBars.length) { ovWhy = "no bars"; return; }
  if (ovBusy) { ovWhy = "busy"; return; }
  ovWhy = "running";
  ovBusy = true;
  try {
    const sym = String(window.LabDefaultSymbol);
    // Vela's bar.time is EPOCH MILLISECONDS (the provider multiplies TradeX's
    // seconds by 1000), while the markers API speaks seconds. Mixing the two
    // sent the server a timestamp in the year 57927.
    const from = Math.floor(lastBars[0].time / 1000);
    const to = Math.floor(lastBars[lastBars.length - 1].time / 1000) + 86400;
    const q = new URLSearchParams({ symbol: sym, from, to, kind: ovMode === "orders" ? "orders" : "backtest" });
    if (ovMode === "orders") q.set("status", "filled");
    else { q.set("table", ovTable); if (ovStrategy) q.set("strategy", ovStrategy); }
    const data = await fetch("/api/cait/markers?" + q, { headers: window.labHeaders() }).then((r) => r.json());
    if (data.error || !data.markers) { ovWhy = "api: " + (data.error || "no markers"); return; }
    ovInfoLast = { shown: data.markers.length, total: data.total || data.markers.length, sampled: !!data.sampled };

    // Collapse per bar and side. Vela draws real objects, so an un-collapsed
    // June of ETHUSD would add thousands of drawings and make the chart unusable.
    // Snap in seconds; anchor in milliseconds.
    const secs = lastBars.map((b) => Math.floor(b.time / 1000));
    const snap = (t) => { let lo = 0, hi = secs.length - 1, best = -1;
      while (lo <= hi) { const m = (lo + hi) >> 1; if (secs[m] <= t) { best = m; lo = m + 1; } else hi = m - 1; }
      return best < 0 ? null : best; };
    const groups = new Map();
    for (const m of data.markers) {
      const i = snap(m.time); if (i === null) continue;
      const key = `${secs[i]}|${m.side}|${m.kind}`;
      const g = groups.get(key);
      if (g) { g.n++; g.px += m.price; g.pnl += (m.pnl_pct || 0); }
      else groups.set(key, { i, t: lastBars[i].time, n: 1, px: m.price, pnl: m.pnl_pct || 0, m });
    }
    // Hard cap: these are chart objects, and past a few hundred Vela slows down.
    const list = [...groups.values()].sort((a, b) => a.t - b.t).slice(0, 300);
    const t = HubTheme;
    for (const g of list) {
      const buy = g.m.side === "BUY", bar = lastBars[g.i];
      const avg = g.px / g.n;
      const order = g.m.kind === "order";
      const color = order
        ? (g.m.status && g.m.status !== "filled" ? t.faint : (buy ? t.up : t.down))
        : (g.m.kind === "backtest_entry" ? t.accent : (g.pnl >= 0 ? t.up : t.down));
      // Anchor off the bar so the marker does not sit on top of the candle body.
      const pad = (bar.high - bar.low || avg * 0.002) * 0.6;
      const price = buy ? bar.low - pad : bar.high + pad;
      const label = g.n > 1 ? `${g.m.side} x${g.n} @ ${avg.toPrecision(6)}` : g.m.text;
      const r = ovAdd(buy ? OV_UP_TOOLS : OV_DOWN_TOOLS, buy ? ovUpTool : ovDownTool,
                      { time: g.t, price }, color, label);
      if (r) { ovHandles.push(r.handle); if (buy) ovUpTool = r.tool; else ovDownTool = r.tool; }
      else ovWhy = "drawings.add failed for every tool name";
    }
    ovShowInfo(ovHandles.length);
  } catch (e) { ovWhy = "threw: " + (e && e.message); throw e; } finally { ovBusy = false; }
}

const ovEl = (id) => document.getElementById(id);
function ovShowInfo(drawn) {
  const el = ovEl("ovinfo"); if (!el) return;
  const i = ovInfoLast;
  if (ovMode === "off" || !i) { el.textContent = ""; el.className = ""; return; }
  if (!i.total) { el.textContent = "none in view"; el.className = ""; return; }
  const grouped = drawn && drawn < i.shown ? `, grouped to ${drawn}` : "";
  el.textContent = i.sampled ? `${i.shown} of ${i.total} sampled${grouped}` : `${i.total} marker${i.total === 1 ? "" : "s"}${grouped}`;
  el.className = i.sampled ? "warn" : "";
}

async function ovLoadStrategies() {
  const sel = ovEl("ovstrategy"); sel.innerHTML = "";
  sel.add(new Option("All strategies", ""));
  try {
    const r = await fetch("/api/cait/backtests?table=" + encodeURIComponent(ovTable), { headers: window.labHeaders() }).then((x) => x.json());
    (r.strategies || []).forEach((n) => sel.add(new Option(n, n)));
  } catch (e) {}
}

function ovSync() {
  const on = ovAvailable();
  ovEl("ovgroup").classList.toggle("show", on);
  const bt = ovEl("ovmode").value === "backtest";
  ovEl("ovtable").style.display = bt ? "" : "none";
  ovEl("ovstrategy").style.display = bt ? "" : "none";
  if (!on) { ovEl("ovinfo").textContent = ""; }
}

async function ovInit() {
  try {
    const r = await fetch("/api/cait/backtests", { headers: window.labHeaders() }).then((x) => x.json());
    (r.tables || []).forEach((t) => ovEl("ovtable").add(new Option(t, t)));
    ovEl("ovtable").value = ovTable;
  } catch (e) {}
  await ovLoadStrategies();
  ovEl("ovmode").addEventListener("change", () => { ovMode = ovEl("ovmode").value; ovSync(); ovPaint(); });
  ovEl("ovtable").addEventListener("change", async () => { ovTable = ovEl("ovtable").value; await ovLoadStrategies(); ovStrategy = ""; ovPaint(); });
  ovEl("ovstrategy").addEventListener("change", () => { ovStrategy = ovEl("ovstrategy").value; ovPaint(); });
  ovSync();
}

window.labChart = {
  name: "vela",
  // Switch in place: indicators re-run on the new bars; panes, drawings and settings stay.
  // Layout in place (cells keep their state); new cells get the theme colours.
  setLayout: (layout) => { document.getElementById("layout").value = layout || ""; if (ws.setLayout) { ws.setLayout(layout || "1"); setTimeout(applyTheme, 1500); } else build(layout || ""); },
  applyTheme,
  // Add a Pine Script indicator to the active chart. Resolves {ok, id, error}.
  removePine: (id) => {
    const h = (window.pineHandles || {})[id] || ws.chart.indicators().find((x) => x.id === id);
    if (h) { h.remove(); if (window.pineHandles) delete window.pineHandles[id]; return true; } return false;
  },
  // Vela's own (native, core-computed) indicators: catalog, add.
  natives: async () => (await ws.chart.availableNativeIndicators()).map((n) => ({ type: n.type, title: n.title, supported: n.supported, present: n.present, multi: !!n.multiInstance, beta: !!n.beta })),
  addNative: (type, inputs) => {
    try {
      const h = ws.chart.addNativeIndicator(type, inputs ? { inputs } : undefined);
      if (!h || !h.id) return { ok: false, error: "not available on this chart" };
      (window.pineHandles = window.pineHandles || {})[h.id] = h; return { ok: true, id: h.id, title: h.title };
    } catch (e) { return { ok: false, error: String(e.message || e) }; }
  },
  // Everything on the chart now (script + native), for the dialog and for the click tests.
  lastRun: (id) => (window.lastRuns || {})[id] || null,
  onChart: () => ws.chart.indicators().map((h) => ({ id: h.id, title: h.title, native: h.nativeType || null, visible: h.visible })),
  addPine: async (source, inputs, props) => {
    try {
      const opt = {}; if (inputs && Object.keys(inputs).length) opt.inputs = inputs; if (props && Object.keys(props).length) opt.props = props;
      const h = ws.chart.addIndicator(source, opt);
      (window.pineHandles = window.pineHandles || {})[h.id] = h;
      const res = await new Promise((done) => {
        const t = setTimeout(() => done({ ok: true, id: h.id, pending: true, note: "no result within 15 s (no chart data yet?)" }), 15000);
        h.on("ready", () => { clearTimeout(t); done({ ok: true, id: h.id, title: h.title });
          if (LabEmbedded) window.parent.postMessage({ evt: "ind:ready", id: h.id }, location.origin); });  // also after a late start
        h.on("error", ({ error }) => { clearTimeout(t); done({ ok: false, id: h.id, error: String(error && error.message || error) }); });
      });
      return res;
    } catch (e) { return { ok: false, error: String(e.message || e) }; }
  },
  setMarket: (symbol, tf) => (window.LabDefaultSymbol = symbol, window.LabDefaultTF = tf || LabDefaultTF, ws.chart.setMarket({ symbol: "lab:" + symbol, timeframe: VELA_TF[tf] || "1" })),
  setTF: (t) => ws.chart.setTimeframe ? ws.chart.setTimeframe({ M1: "1", M5: "5", M15: "15", M30: "30", H1: "60", H4: "240", D1: "1D" }[t]) : null,
  addCodeTrendline,
  setOverlay: async (mode, opts) => { ovMode = mode || "off"; if (opts) { if (opts.table) { ovTable = opts.table; document.getElementById("ovtable").value = ovTable; await ovLoadStrategies(); } ovStrategy = opts.strategy || ""; } document.getElementById("ovmode").value = ovMode; ovSync(); return ovPaint(); },
  overlay: () => ({ mode: ovMode, table: ovTable, strategy: ovStrategy, available: ovAvailable(), last: ovInfoLast, drawn: ovHandles.length, why: ovWhy }),
  drawingCount: () => { try { return ws.chart.drawings.list().length; } catch (_) { return -1; } },
  barCount: () => lastBars.length,
};
</script>
